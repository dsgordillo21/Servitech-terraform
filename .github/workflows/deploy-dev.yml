name: ServiTech Deploy Dev

on:
  push:
    branches:
      - development

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Desplegar ServiTech en dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_WORKSPACE: default

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Construir paquetes Lambda
        run: |
          rm -rf build
          mkdir -p build/pkg_registrar
          mkdir -p build/pkg_consultar

          pip install \
            -r lambda/requirements.txt \
            --target build/pkg_registrar

          cp lambda/registrar_servicio/lambda_function.py \
            build/pkg_registrar/lambda_function.py

          cp -r build/pkg_registrar/. build/pkg_consultar/

          cp lambda/consultar_servicio/lambda_function.py \
            build/pkg_consultar/lambda_function.py

          cd build/pkg_registrar
          zip -r ../registrar_servicio.zip .
          cd ../..

          cd build/pkg_consultar
          zip -r ../consultar_servicio.zip .
          cd ../..

          echo "Paquetes Lambda creados:"
          ls -lh build/*.zip

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Autenticarse en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Inicializar Terraform
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Comprobar formato Terraform
        working-directory: terraform
        run: terraform fmt -check

      - name: Validar Terraform
        working-directory: terraform
        run: terraform validate

      - name: Planificar despliegue
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Aplicar plan
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
